<div class="child-card">
     <div class="child-header">
          <h6>Child Component</h6>
          <span>Child</span>
     </div>

     <div class="child-body">
          <div class="child-section">
               <h6>Input Signal</h6>

               <div class="data-box">
                    <span>Received User Name</span>
                    <strong>{{ userName() }}</strong>
               </div>
          </div>

          <div class="child-section">
               <h6>Output Signal</h6>
               <p>Send events and data to parent component.</p>

               <div class="d-flex flex-wrap gap-2">

                    <button type="button" class="btn btn-success btn-sm" (click)="onSave()">
                         Save
                    </button>

                    <button type="button" class="btn btn-primary btn-sm" (click)="selectUser()">
                         Select User
                    </button>
               </div>
          </div>

          <div class="child-section">
               <h6>Model Signal</h6>

               <div class="data-box">
                    <span>Child Quantity</span>
                    <strong>{{ quantity() }}</strong>
               </div>
               <button type="button" class="btn btn-primary btn-sm mt-3" (click)="increase()">
                    Increase Quantity
               </button>
          </div>
     </div>
</div>
<div class="container-fluid">
     <div class="row">
          <div class="col-12 col-md-12">
               <p>Child Component</p>
          </div>
     </div>
     <div class="row">
          <div class="col-12 col-md-6">
               <p>User Name From Parent Com.</p>
          </div>
          <div class="col-12 col-md-6">
               <b> {{userName()}} </b>
          </div>
     </div>
     <div class="row mt-2">
          <div class="col-12 col-md-12">
               <p>User Form Inside Child</p>
               <form [formGroup]="userForm" (ngSubmit)="submit()">
                    <input type="text" placeholder="Enter name" class="form-control" formControlName="username"><br>
                    <input type="number" class="form-control" placeholder="Enter age" formControlName="age"><br>

                    <button type="submit" class="btn btn-primary">Save</button>
               </form>
          </div>
     </div>
</div>
